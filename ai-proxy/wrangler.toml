# The AI proxy for the GitHub Pages demo: runs the agents' language model
# calls on Workers AI. Deploy with `npm run deploy` (see README.md).
name = "uuv-ai-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[vars]
# The sites allowed to call it (comma-separated)
ALLOWED_ORIGINS = "https://udaydeep2611.github.io"
MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"

# Per visitor: 12 calls a minute (one chat message makes 1-3 calls)
[[ratelimits]]
name = "VISITOR_LIMIT"
namespace_id = "2611"
  [ratelimits.simple]
  limit = 12
  period = 60

# Everyone together: 120 calls a minute
[[ratelimits]]
name = "TOTAL_LIMIT"
namespace_id = "2612"
  [ratelimits.simple]
  limit = 120
  period = 60
