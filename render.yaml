# Hosts the server and the built app together as one Render web service.
services:
  - type: web
    name: ultraunityverse
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client --include=dev && VITE_API_URL= npm run build --prefix client && npm ci --prefix server --omit=dev
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
